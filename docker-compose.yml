version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: querymind-postgres
    restart: always
    environment:
      POSTGRES_DB: querymind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: querymind-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgrespassword
      DB_NAME: querymind
      RO_DB_USER: querymind_readonly
      RO_DB_PASS: readonly_secure_pass
      BACKEND_PORT: 8008
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: querymind-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8008/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
